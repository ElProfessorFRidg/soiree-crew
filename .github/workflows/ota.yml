name: Expo OTA
run-name: OTA ${{ inputs.release }} · ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact GitHub IPA release tag (for example v0.2.12-preview.28+build.310)
        required: true
      target:
        description: Device target of the installed IPA
        type: choice
        options: [both, iphone, ipad]
        required: true
      rollback:
        description: Send the installed IPAs back to their embedded bundle instead of publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        required: true
        type: string
      target:
        required: true
        type: string
      automatic:
        type: boolean
        default: true
    secrets:
      OTA_PUBLISH_TOKEN:
        required: true
      OTA_SIGNING_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: crew-ota-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || (contains(inputs.release, '-preview.') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'both' && '["iphone","ipad"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release }}
      CREW_IOS_TARGET: ${{ matrix.target }}
      CREW_RELEASE_CHANNEL: ${{ contains(inputs.release, '-preview.') && 'preview' || 'public' }}
      CREW_OTA_URL: ${{ vars.CREW_OTA_URL }}
      CREW_SERVER_URL: ${{ contains(inputs.release, '-preview.') && (vars.CREW_PREVIEW_SERVER_URL || vars.CREW_SERVER_URL) || vars.CREW_SERVER_URL }}
      CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install lockfile analyzer
        run: python3 -m pip install --user --break-system-packages PyYAML==6.0.2
      - name: Verify target and compatible changes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?\+build\.[0-9]+$ ]]
          test -n "$CREW_OTA_URL"
          gh release download "$RELEASE_TAG" --pattern "ios-build-info-$CREW_IOS_TARGET.json" --dir "$RUNNER_TEMP"
          node tools/ci/plan-ota.mjs "$RELEASE_TAG" "$CREW_IOS_TARGET" "$RUNNER_TEMP/ios-build-info-$CREW_IOS_TARGET.json" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.automatic }}
        run: pnpm check
      - name: Reject superseded automatic publication
        if: ${{ inputs.automatic && github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR" ]]; then
            test "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$PR_HEAD"
            [[ "$RELEASE_TAG" == *"-preview.$PR+build."* ]]
          else
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          fi
      - name: Publish iOS update
        id: publish_update
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ steps.plan.outputs.version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.build }}
          OTA_STREAM: ${{ steps.plan.outputs.stream }}
          OTA_RUNTIME: ${{ steps.plan.outputs.runtime }}
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          OTA_ROLLBACK: ${{ inputs.rollback == true }}
          OTA_MESSAGE: Soirée Crew ${{ github.sha }}
        run: |
          pnpm exec expo config --type public --json | node -e '
            const c = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (c.runtimeVersion !== process.env.OTA_RUNTIME ||
                c.updates?.requestHeaders?.["expo-channel-name"] !== process.env.OTA_STREAM) {
              throw new Error("The update config does not match the selected IPA");
            }
          '
          # Self-hosted update server (docs/OTA.md): export here, sign here, upload the result.
          rm -rf dist
          pnpm exec expo export --platform ios --output-dir dist
          pnpm exec expo config --type public --json > dist/expoConfig.json
          OTA_DIST=dist node ../../tools/ci/publish-ota.mjs

      - name: Record OTA receipt
        if: ${{ inputs.rollback != true }}
        env:
          UPDATE_ID: ${{ steps.publish_update.outputs.update_id }}
          OTA_RUNTIME: ${{ steps.plan.outputs.runtime }}
          OTA_STREAM: ${{ steps.plan.outputs.stream }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" --arg target "$CREW_IOS_TARGET" --arg id "$UPDATE_ID" --arg runtime "$OTA_RUNTIME" --arg stream "$OTA_STREAM" '{tag:$tag,target:$target,id:$id,runtime:$runtime,stream:$stream}' > ota-receipt.json
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.rollback != true }}
        with:
          name: ota-receipt-${{ matrix.target }}
          path: ota-receipt.json
          if-no-files-found: error
      - name: Publish changelog entry
        if: ${{ inputs.rollback != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/ota-notes.md"
          PREVIOUS=$(git tag --list "ota-${RELEASE_TAG}-${CREW_IOS_TARGET}-*" --sort=-version:refname | awk 'NR==1')
          git log "refs/tags/${PREVIOUS:-$RELEASE_TAG}..HEAD" --no-merges --pretty=format:'- %s' -25 > "$NOTES"
          if [[ ! -s "$NOTES" ]]; then printf '%s\n' '- Correctif compatible avec cette version.' > "$NOTES"; fi
          NOTE_TAG="ota-${RELEASE_TAG}-${CREW_IOS_TARGET}-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$NOTE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title "Soirée Crew · ${CREW_RELEASE_CHANNEL} · OTA ${RELEASE_TAG} · ${CREW_IOS_TARGET}" --notes-file "$NOTES"

  altstore:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'failure')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/altstore.yml
