name: diag-release
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  diag:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci-robust'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          try() {
            name=$1; shift
            out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" "$@" 2>&1) && code=0 || code=$?
            id=$(echo "$out" | jq -r '.id? // empty' 2>/dev/null) || id=
            echo "RES $name -> exit=$code id=${id:-none} $(echo "$out" | head -c 100 | tr '\n' ' ')"
            if [ -n "$id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null; fi
          }
          echo "RES merge=$GITHUB_SHA head=$HEAD_SHA"
          try "P1 draft, PR head sha"          -f tag_name=v0.0.5-diag.1 -f target_commitish="$HEAD_SHA" -F draft=true -F prerelease=true
          try "P2 draft, merge sha"            -f tag_name=v0.0.5-diag.2 -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease=true
          try "P3 published, merge sha"        -f tag_name=v0.0.5-diag.3 -f target_commitish="$GITHUB_SHA" -F draft=false -F prerelease=true -f make_latest=false
          try "P4 published, PR head sha"      -f tag_name=v0.0.5-diag.4 -f target_commitish="$HEAD_SHA" -F draft=false -F prerelease=true -f make_latest=false
          for t in v0.0.5-diag.3 v0.0.5-diag.4; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" >/dev/null 2>&1 || true; done
