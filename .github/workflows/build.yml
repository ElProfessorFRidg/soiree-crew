name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:slop

  ios:
    # Unsigned IPA: sign it on your side with your sideloading tool (ADR 0001).
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Build the app without signing
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 200
      - name: Pack the IPA
        working-directory: apps/mobile/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../../../soiree-crew-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: soiree-crew-ios-unsigned
          path: soiree-crew-unsigned.ipa
          retention-days: 14

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Build the APK
        working-directory: apps/mobile/android
        # The Expo template signs release builds with the debug key: fine for personal installs.
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: soiree-crew-android
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
