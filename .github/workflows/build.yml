name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      android:
        description: Also build the Android APK
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:slop
      - name: Audit production dependencies (SEC-09, reported, not blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  version:
    # Version names (docs/VERSIONING.md): app.json holds the series (0.1, 0.2, 1.0...), each release
    # of main takes the next patch number after the highest tag of that series: 0.1.1, 0.1.2...
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: next
        run: git ls-remote --tags origin | node tools/ci/next-version.mjs >> "$GITHUB_OUTPUT"

  ios:
    # Unsigned IPA: sign it on your side with your sideloading tool (ADR 0001).
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    # Read by app.config.ts at prebuild and again when Xcode bundles the JavaScript (expo-constants).
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # expo-modules-jsi 58.0.21 needs a recent Swift: Xcode 26.3 rejects it. 26.6 is the newest on
          # GitHub's macOS 26 runners (no Xcode 27 there yet).
          xcode-version: "26.6"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build caches kept between runs: ccache serves the C, C++ and Objective-C compiles (React
      # Native and the native modules), the CocoaPods cache saves the pod downloads.
      - name: Install ccache
        run: brew install ccache
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ccache
            ~/Library/Caches/CocoaPods
          key: ios-build-xcode26.6-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ios-build-xcode26.6-${{ hashFiles('pnpm-lock.yaml') }}-
            ios-build-xcode26.6-
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CREW_SERVER_URL: ${{ vars.CREW_SERVER_URL }}
          CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
          # React Native wires ccache into every pod when this is set at pod install.
          USE_CCACHE: "1"
        run: npx expo prebuild --platform ios --clean
      # ExpoModulesJSI is the slowest piece to compile. Its build script reuses a slice whose
      # recorded source hash (sources, paths, Swift and Xcode versions) still matches.
      - uses: actions/cache@v6
        with:
          path: apps/mobile/ios/build/Build/Products/ExpoModulesJSI.xcframework
          key: expo-modules-jsi-xcode26.6-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build the app without signing
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild.log 2>&1 || {
              # The real error is usually far above the summary: every error line first, then the end.
              grep -nE "error:|error \(|Error:|fatal|Command PhaseScriptExecution failed" xcodebuild.log | head -n 120
              tail -n 120 xcodebuild.log
              exit 1
            }
          tail -n 20 xcodebuild.log
          ccache --show-stats || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xcodebuild-device-log
          path: apps/mobile/ios/xcodebuild.log
          retention-days: 7
      - name: Pack the IPA
        working-directory: apps/mobile/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          # An empty shell of an app must never be packed and released again.
          test -f "$APP/Info.plist" && test -f "$APP/main.jsbundle" || { echo "::error::The built app is incomplete"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../../../soiree-crew-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: soiree-crew-ios-unsigned
          path: soiree-crew-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    # iOS only for now: the APK is built on demand (Run workflow, "Also build the Android APK").
    if: github.event_name == 'workflow_dispatch' && inputs.android
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CREW_SERVER_URL: ${{ vars.CREW_SERVER_URL }}
          CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
        run: npx expo prebuild --platform android --clean
      - name: Build the APK
        working-directory: apps/mobile/android
        # The Expo template signs release builds with the debug key: fine for personal installs.
        # arm64 only: every phone from the last decade, and half the native build time.
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: |
          # gradle.properties has no final newline: start a new line before adding to it.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          # The runner sometimes gets a truncated NDK download: one clean retry before giving up.
          ./gradlew assembleRelease --no-daemon || { rm -rf "$ANDROID_HOME/ndk/"*.tmp "$HOME/.android/cache"; sleep 20; ./gradlew assembleRelease --no-daemon; }
      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk soiree-crew.apk
      - uses: actions/upload-artifact@v7
        with:
          name: soiree-crew-android
          path: soiree-crew.apk
          if-no-files-found: error
          retention-days: 14

  ios-launch:
    # Launches the very IPA that gets released, in a simulator: its binaries are re-marked for the
    # simulator (same arm64 code on Apple Silicon) and signed ad hoc, so nothing is compiled twice.
    # A crash at startup fails the run, with the app log and crash report as an artifact.
    needs: ios
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - uses: actions/download-artifact@v8
        with:
          name: soiree-crew-ios-unsigned
      - name: Make the IPA runnable in the simulator
        run: |
          unzip -q soiree-crew-unsigned.ipa -d sim
          APP=$(ls -d sim/Payload/*.app | head -n 1)
          python3 tools/ci/ios-device-to-simulator.py "$APP"
          # Inside out: frameworks, then the app extensions (Live Activity), then the app.
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib "$APP"/PlugIns/*.appex/Frameworks/*.framework; do
            if [ -e "$f" ]; then codesign --force --sign - --timestamp=none "$f"; fi
          done
          for f in "$APP"/PlugIns/*.appex; do
            if [ -e "$f" ]; then codesign --force --sign - --timestamp=none "$f"; fi
          done
          codesign --force --sign - --timestamp=none "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Launch and watch for 40 s
        run: |
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          mkdir -p launch
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 40
          xcrun simctl io "$DEVICE" screenshot launch/after-40s.png || true
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate "process CONTAINS 'Soir' OR eventMessage CONTAINS 'JS Exception' OR eventMessage CONTAINS 'RCTFatal'" > launch/app.log || true
          cp ~/Library/Logs/DiagnosticReports/*.ips launch/ 2>/dev/null || true
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE"; then
            echo "Still running 40 s after launch."
          else
            echo "::error::The app is not running 40 s after launch. Crash report and log are in the ios-launch artifact."
            grep -E "Unhandled JS Exception|Terminating app|Symbol not found|Library not loaded" launch/app.log | head -n 20 || true
            awk '/Terminating app/{f=1} f{print; n++} n>40{exit}' launch/app.log || true
            exit 1
          fi
      - name: Screens on iOS
        # Real iOS rendering of the main screens (clipped glyphs, safe areas, alignment), with a
        # profile already stored so the app opens past onboarding.
        run: |
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v))')
          xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          xcrun simctl status_bar "$DEVICE" override --time 21:42 --batteryLevel 80 || true
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          STORE="$DATA/Library/Application Support/$BUNDLE/RCTAsyncLocalStorage_V1"
          mkdir -p "$STORE"
          python3 - "$STORE" <<'PY'
          import hashlib, json, os, sys, time, uuid
          now = int(time.time() * 1000)
          def pint(minutes_ago):
              at = now - minutes_ago * 60000
              return {"id": str(uuid.uuid4()), "presetId": "m-pint", "kind": "pint", "volumeMl": 500, "abv": 0.05,
                      "consumedAt": at, "loggedAt": at, "withFood": False, "sync": "saved"}
          state = {"state": {"ageConfirmedAt": now,
                   "preferences": {"language": "fr", "legalCountry": "FR", "bacUnit": "g_per_l_blood", "currency": "EUR"},
                   "profile": {"weightKg": 72, "bodyModel": "male", "declaredBody": "male", "healthConsentAt": now},
                   "drinks": [pint(70), pint(25)]}, "version": 0}
          # AsyncStorage keeps a long value in a file named after the key's MD5, with null in the manifest.
          key = "crew-app-v1"
          open(os.path.join(sys.argv[1], hashlib.md5(key.encode()).hexdigest()), "w").write(json.dumps(state))
          json.dump({key: None}, open(os.path.join(sys.argv[1], "manifest.json"), "w"))
          PY
          mkdir -p launch/screens
          n=1
          # One launch per screen: the app reads -ciRoute from its launch arguments (custom URL schemes
          # ask "Open in ...?" on recent simulators, which no script can answer).
          for route in / /crew /games /bars /me /settings /my-stats /add-drink /curve /limits /leaderboard /history; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
            if [ "$route" = "/" ]; then xcrun simctl launch "$DEVICE" "$BUNDLE"; else xcrun simctl launch "$DEVICE" "$BUNDLE" -ciRoute "$route"; fi
            sleep 10
            name=$(echo "$route" | tr -d '/'); [ -z "$name" ] && name=party
            xcrun simctl io "$DEVICE" screenshot "launch/screens/$(printf %02d $n)-$name.png" || true
            n=$((n + 1))
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-launch
          path: launch
          if-no-files-found: ignore
          retention-days: 14

  release:
    # Every build of main becomes the latest release, so these links never change:
    # https://github.com/<owner>/soiree-crew/releases/latest/download/soiree-crew-unsigned.ipa
    # https://github.com/<owner>/soiree-crew/releases/latest/download/soiree-crew.apk
    needs: [version, checks, ios, ios-launch, android]
    # The APK job is usually skipped; the release goes out with what was built.
    if: always() && needs.checks.result == 'success' && needs.ios.result == 'success' && needs.ios-launch.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Semver build metadata after "+": older apps read the build number from the tag.
          TAG="v${VERSION}+build.${GITHUB_RUN_NUMBER}"
          {
            echo "Version ${VERSION}, build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7}."
            echo
            echo "- iOS: \`soiree-crew-unsigned.ipa\`, unsigned. Sign it with your sideloading tool."
            if [ -f dist/soiree-crew.apk ]; then echo "- Android: \`soiree-crew.apk\`, signed with the debug key. Allow installs from this source."; fi
            echo
            git log -1 --pretty=format:'%s'
          } > notes.md
          FILES="dist/soiree-crew-unsigned.ipa"
          [ -f dist/soiree-crew.apk ] && FILES="$FILES dist/soiree-crew.apk"
          gh release create "$TAG" $FILES             --title "Soirée Crew ${VERSION}"             --notes-file notes.md             --target "$GITHUB_SHA"             --latest
