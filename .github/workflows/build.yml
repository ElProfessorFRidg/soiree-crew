name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:slop
      - name: Audit production dependencies (SEC-09, reported, not blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  ios:
    # Unsigned IPA: sign it on your side with your sideloading tool (ADR 0001).
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CREW_SERVER_URL: ${{ vars.CREW_SERVER_URL }}
          CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
        run: npx expo prebuild --platform ios --clean
      - name: Build the app without signing
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 200
      - name: Pack the IPA
        working-directory: apps/mobile/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../../../soiree-crew-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: soiree-crew-ios-unsigned
          path: soiree-crew-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CREW_SERVER_URL: ${{ vars.CREW_SERVER_URL }}
          CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
        run: npx expo prebuild --platform android --clean
      - name: Build the APK
        working-directory: apps/mobile/android
        # The Expo template signs release builds with the debug key: fine for personal installs.
        # arm64 only: every phone from the last decade, and half the native build time.
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: |
          # gradle.properties has no final newline: start a new line before adding to it.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          # The runner sometimes gets a truncated NDK download: one clean retry before giving up.
          ./gradlew assembleRelease --no-daemon || { rm -rf "$ANDROID_HOME/ndk/"*.tmp "$HOME/.android/cache"; sleep 20; ./gradlew assembleRelease --no-daemon; }
      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk soiree-crew.apk
      - uses: actions/upload-artifact@v7
        with:
          name: soiree-crew-android
          path: soiree-crew.apk
          if-no-files-found: error
          retention-days: 14

  release:
    # Every build of main becomes the latest release, so these links never change:
    # https://github.com/<owner>/soiree-crew/releases/latest/download/soiree-crew-unsigned.ipa
    # https://github.com/<owner>/soiree-crew/releases/latest/download/soiree-crew.apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          {
            echo "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7}."
            echo
            echo "- iOS: \`soiree-crew-unsigned.ipa\`, unsigned. Sign it with your sideloading tool."
            echo "- Android: \`soiree-crew.apk\`, signed with the debug key. Allow installs from this source."
            echo
            git log -1 --pretty=format:'%s'
          } > notes.md
          gh release create "$TAG" dist/soiree-crew-unsigned.ipa dist/soiree-crew.apk             --title "Soirée Crew ${VERSION} (build ${GITHUB_RUN_NUMBER})"             --notes-file notes.md             --target "$GITHUB_SHA"             --latest
