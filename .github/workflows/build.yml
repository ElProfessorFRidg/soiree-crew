name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_ipa:
        description: Build a new IPA even if an OTA is possible
        type: boolean
        default: false
      android:
        description: Also build the Android APK
        type: boolean
        default: false
      pr:
        description: Build the Preview IPA of this PR (set by the /ipa comment, ipa-command.yml)
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && vars.CREW_OTA_URL == '' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test OTA publication over HTTP
        run: node --test tools/ci/ota-publication-http.integration.mjs
      - name: Test IPA release selection
        run: node --test tools/ci/select-ota-base.integration.mjs
      - name: Test delivery integrity
        run: node --test tools/ci/delivery-integrity.integration.mjs
      - run: pnpm lint:slop
      - name: Audit production dependencies (SEC-09, reported, not blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  version:
    runs-on: ubuntu-latest
    env:
      CREW_SERVER_URL: ${{ (github.event_name == 'pull_request' || inputs.pr != '') && vars.CREW_PREVIEW_SERVER_URL || vars.CREW_SERVER_URL }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      ota_base: ${{ steps.route.outputs.release }}
      ota_matrix: ${{ steps.route.outputs.matrix }}
      skip_ipa: ${{ steps.route.outputs.skip_ipa }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install lockfile analyzer
        run: |
          python3 -m pip install --user --break-system-packages PyYAML==6.0.2
          python3 tools/ci/dependency-impact-test.py
      - name: Resolve PR server origin
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number || inputs.pr }}
          CREW_PREVIEW_URL_TEMPLATE: ${{ vars.CREW_PREVIEW_URL_TEMPLATE }}
        run: node tools/ci/resolve-preview-origin.mjs
      - name: Select OTA or native build
        id: route
        if: ${{ !inputs.force_ipa && !inputs.android }}
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_AUTHORIZED: ${{ secrets.OTA_PUBLISH_TOKEN != '' && secrets.OTA_SIGNING_KEY != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OTA_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CREW_OTA_URL: ${{ vars.CREW_OTA_URL }}
          CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
          OTA_HISTORY_LIMIT: ${{ vars.CREW_OTA_HISTORY_LIMIT || '5' }}
        # Every outcome records why (route + reason): the summary and the PR comment show it.
        run: |
          decide() {
            printf 'route=%s\n' "$1" >> "$GITHUB_OUTPUT"
            { echo 'reason<<CREW_REASON'; printf '%s\n' "$2"; if [[ -n "${3:-}" ]]; then printf '%s\n' "$3"; fi; echo 'CREW_REASON'; } >> "$GITHUB_OUTPUT"
            { printf '### %s\n\n' "$2"; if [[ -n "${3:-}" ]]; then printf '%s\n' "$3"; fi; } >> "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$CHANGE_BASE" =~ ^[a-f0-9]{40}$ ]] && git cat-file -e "$CHANGE_BASE^{commit}"; then
            IMPACT=$(node tools/ci/change-impact.mjs "$CHANGE_BASE")
            if [[ "$IMPACT" == checks ]]; then
              echo 'skip_ipa=true' >> "$GITHUB_OUTPUT"
              decide checks 'No mobile changes: checks only.'
              exit 0
            fi
          fi
          if [[ "$OTA_ALLOWED" != true ]]; then decide ipa 'New IPA: OTA updates are off for pull requests from forks.'; exit 0; fi
          if [[ "$OTA_AUTHORIZED" != true || -z "$CREW_OTA_URL" ]]; then
            decide ipa 'New IPA: OTA updates are not configured (CREW_OTA_URL, OTA_PUBLISH_TOKEN, OTA_SIGNING_KEY).'
            exit 0
          fi
          # A PR only updates its own preview runtime; other PRs cannot overwrite it.
          RELEASES="$RUNNER_TEMP/releases.json"
          if ! gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add // []' > "$RELEASES"; then
            echo '::error::Unable to read GitHub releases; retry the workflow.'
            exit 1
          fi
          if ! TAG=$(node tools/ci/select-ota-base.mjs "$RELEASES" 2>"$RUNNER_TEMP/select.err"); then
            cat "$RUNNER_TEMP/select.err" >&2
            exit 1
          fi
          echo "Releases: $(jq length "$RELEASES"), IPA to patch: ${TAG:-none}"
          if [[ -z "$TAG" ]]; then
            if [[ -n "$PR_NUMBER" ]]; then KIND='preview IPA of this PR'; else KIND='public IPA'; fi
            decide ipa "New IPA: no $KIND with OTA updates to patch yet."
            exit 0
          fi
          # The newest IPA must be compatible before selecting OTA. Older compatible
          # builds are additional recipients, never a substitute for a new required IPA.
          [[ "$OTA_HISTORY_LIMIT" =~ ^([1-9]|1[0-9]|20)$ ]] || { echo "::error::Invalid OTA history limit"; exit 1; }
          ALL_CANDIDATES=1 node tools/ci/select-ota-base.mjs "$RELEASES" > "$RUNNER_TEMP/candidates"
          MATRIX="$RUNNER_TEMP/ota-matrix.json"
          echo '[]' > "$MATRIX"
          COUNT=0
          while IFS= read -r CANDIDATE; do
            [[ -n "$CANDIDATE" ]] || continue
            COUNT=$((COUNT+1))
            if (( COUNT > OTA_HISTORY_LIMIT )); then break; fi
            jq --arg tag "$CANDIDATE" 'map(select(.tag_name == $tag)) | if length == 1 then .[0] else error("ambiguous release") end' "$RELEASES" > "$RUNNER_TEMP/candidate.json"
            for TARGET in iphone ipad; do
              INFO="ios-build-info-$TARGET.json"
              if ! gh release download "$CANDIDATE" --pattern "$INFO" --dir "$RUNNER_TEMP" --clobber; then
                echo "::error::Cannot download $INFO for $CANDIDATE; retry rather than rebuild."
                exit 1
              fi
              node tools/ci/delivery-integrity.mjs assets "$RUNNER_TEMP/candidate.json" "$CANDIDATE" "$RUNNER_TEMP/$INFO"
              if WHY=$(node tools/ci/plan-ota.mjs "$CANDIDATE" "$TARGET" "$RUNNER_TEMP/$INFO" 2>&1 >/dev/null); then
                jq --arg release "$CANDIDATE" --arg target "$TARGET" '. + [{release:$release,target:$target}]' "$MATRIX" > "$MATRIX.next"
                mv "$MATRIX.next" "$MATRIX"
              else
                STATUS=$?
                if [[ "$STATUS" != 2 ]]; then
                  echo "::error::OTA planner failed: $WHY"
                  exit 1
                fi
                if [[ "$CANDIDATE" == "$TAG" ]]; then
                  decide ipa "New IPA: incompatible newest runtime $TAG ($TARGET)." "$WHY"
                  exit 0
                fi
                printf 'Excluded older runtime %s (%s): %s\n' "$CANDIDATE" "$TARGET" "$WHY"
              fi
            done
          done < "$RUNNER_TEMP/candidates"
          printf 'release=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$(jq -c . "$MATRIX")" >> "$GITHUB_OUTPUT"
          RANGE=$(node tools/ci/ota-compatibility.mjs "$MATRIX")
          decide ota "OTA: verified compatible runtimes for $TAG and eligible older IPAs." "$RANGE"
      - name: Reserve the native version
        id: next
        if: steps.route.outputs.release == '' && steps.route.outputs.skip_ipa != 'true'
        env:
          RESERVE_VERSION: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CREW_WORKFLOW_TOKEN || github.token }}
        run: node tools/ci/next-version.mjs >> "$GITHUB_OUTPUT"
      - name: Tell the PR how this change reaches the phones
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository || inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ steps.route.outputs.route || 'ipa' }}
          REASON: "${{ steps.route.outputs.reason || (inputs.pr != '' && 'New IPA: asked for with /ipa.' || 'New IPA: asked for by hand (Force IPA or Android).') }}"
          VERSION: ${{ steps.next.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node tools/ci/report-route.mjs

  ota:
    needs: [checks, version]
    if: needs.version.outputs.ota_base != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.ota_matrix || '[]') }}
    uses: ./.github/workflows/ota.yml
    permissions:
      contents: write
      actions: read
    with:
      release: ${{ matrix.release }}
      target: ${{ matrix.target }}
    secrets:
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}

  ios:
    # Unsigned IPA: sign it on your side with your sideloading tool (ADR 0001).
    needs: [version, checks]
    if: needs.version.outputs.ota_base == '' && needs.version.outputs.skip_ipa != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iphone
            artifact: soiree-crew-ios-unsigned
            file: soiree-crew-unsigned.ipa
          - target: ipad
            artifact: soiree-crew-ipad-unsigned
            file: soiree-crew-ipad-unsigned.ipa
    # Read by app.config.ts at prebuild and again when Xcode bundles the JavaScript (expo-constants).
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      CREW_IOS_TARGET: ${{ matrix.target }}
      CREW_RELEASE_CHANNEL: ${{ (github.event_name == 'pull_request' || inputs.pr != '') && 'preview' || 'public' }}
      IPA_FILE: ${{ matrix.file }}
      # Forks get no update server: their IPA keeps its embedded bundle.
      CREW_OTA_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CREW_OTA_URL || '' }}
      CREW_SERVER_URL: ${{ (github.event_name == 'pull_request' || inputs.pr != '') && vars.CREW_PREVIEW_SERVER_URL || vars.CREW_SERVER_URL }}
      CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # expo-modules-jsi 58.0.21 needs a recent Swift: Xcode 26.3 rejects it. 26.6 is the newest on
          # GitHub's macOS 26 runners (no Xcode 27 there yet).
          xcode-version: "26.6"
      - name: Check native diagnostics against the supported iOS deployment target
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -target arm64-apple-ios16.4 -sdk "$SDK" apps/mobile/native/startup/CrewStartupDiagnostics.swift apps/mobile/modules/network-diagnostics/ios/CrewNetworkProbe.swift
          xcrun swiftc apps/mobile/modules/network-diagnostics/ios/CrewNetworkProbe.swift tools/ci/check-network-errors.swift -o /tmp/check-network-errors
          /tmp/check-network-errors
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build caches kept between runs: ccache serves the C, C++ and Objective-C compiles (React
      # Native and the native modules), the CocoaPods cache saves the pod downloads.
      - name: Install ccache
        run: brew install ccache
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ccache
            ~/Library/Caches/CocoaPods
          key: ios-build-xcode26.6-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ios-build-xcode26.6-${{ hashFiles('pnpm-lock.yaml') }}-
            ios-build-xcode26.6-
      - name: Resolve PR server origin
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number || inputs.pr }}
          CREW_PREVIEW_URL_TEMPLATE: ${{ vars.CREW_PREVIEW_URL_TEMPLATE }}
        run: node tools/ci/resolve-preview-origin.mjs
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # React Native wires ccache into every pod when this is set at pod install.
          USE_CCACHE: "1"
        run: npx expo prebuild --platform ios --clean
      # ExpoModulesJSI is the slowest piece to compile. Its build script reuses a slice whose
      # recorded source hash (sources, paths, Swift and Xcode versions) still matches.
      - uses: actions/cache@v6
        with:
          path: apps/mobile/ios/build/Build/Products/ExpoModulesJSI.xcframework
          key: expo-modules-jsi-xcode26.6-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build the app without signing
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild.log 2>&1 || {
              # The real error is usually far above the summary: every error line first, then the end.
              grep -nE "error:|error \(|Error:|fatal|Command PhaseScriptExecution failed" xcodebuild.log | head -n 120
              tail -n 120 xcodebuild.log
              exit 1
            }
          tail -n 20 xcodebuild.log
          ccache --show-stats || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xcodebuild-device-log-${{ matrix.target }}
          path: apps/mobile/ios/xcodebuild.log
          retention-days: 7
      - name: Pack the IPA
        working-directory: apps/mobile/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          # An empty shell of an app must never be packed and released again.
          test -f "$APP/Info.plist" && test -f "$APP/main.jsbundle" || { echo "::error::The built app is incomplete"; exit 1; }
          python3 ../../../tools/ci/check-ios-app.py "$APP" "$CREW_IOS_TARGET" "$CREW_RELEASE_CHANNEL" > "../../../ios-build-info-$CREW_IOS_TARGET.json"
          node ../../../tools/ci/native-build-inventory.mjs . > "$RUNNER_TEMP/native-inventory.json"
          python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["nativeInventory"]=json.load(open(sys.argv[2])); open(p,"w").write(json.dumps(d,indent=2))' "../../../ios-build-info-$CREW_IOS_TARGET.json" "$RUNNER_TEMP/native-inventory.json"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "../../../$IPA_FILE" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.file }}
            ios-build-info-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

  android:
    # iOS only for now: the APK is built on demand (Run workflow, "Also build the Android APK").
    if: github.event_name == 'workflow_dispatch' && inputs.android
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      CREW_SERVER_URL: ${{ vars.CREW_SERVER_URL }}
      CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CREW_SERVER_URL: ${{ vars.CREW_SERVER_URL }}
          CREW_PUBLIC_SERVERS: ${{ vars.CREW_PUBLIC_SERVERS }}
        run: npx expo prebuild --platform android --clean
      - name: Build the APK
        working-directory: apps/mobile/android
        # The Expo template signs release builds with the debug key: fine for personal installs.
        # arm64 only: every phone from the last decade, and half the native build time.
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: |
          # gradle.properties has no final newline: start a new line before adding to it.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          # The runner sometimes gets a truncated NDK download: one clean retry before giving up.
          ./gradlew assembleRelease --no-daemon || { rm -rf "$ANDROID_HOME/ndk/"*.tmp "$HOME/.android/cache"; sleep 20; ./gradlew assembleRelease --no-daemon; }
      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk soiree-crew.apk
      - uses: actions/upload-artifact@v7
        with:
          name: soiree-crew-android
          path: soiree-crew.apk
          if-no-files-found: error
          retention-days: 14

  ios-launch:
    # Launches the very IPA that gets released, in a simulator: its binaries are re-marked for the
    # simulator (same arm64 code on Apple Silicon) and signed ad hoc, so nothing is compiled twice.
    # A crash at startup fails the run, with the app log and crash report as an artifact.
    needs: ios
    runs-on: macos-26
    # Simulator boot and screenshots can be slow on shared macOS runners.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            target: iphone
            artifact: soiree-crew-ios-unsigned
            file: soiree-crew-unsigned.ipa
          - family: iPad
            target: ipad
            artifact: soiree-crew-ipad-unsigned
            file: soiree-crew-ipad-unsigned.ipa
    env:
      DEVICE_FAMILY: ${{ matrix.family }}
      IPA_FILE: ${{ matrix.file }}
      CREW_IOS_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
      - name: Make the IPA runnable in the simulator
        run: |
          unzip -q "$IPA_FILE" -d sim
          APP=$(ls -d sim/Payload/*.app | head -n 1)
          python3 tools/ci/check-ios-app.py "$APP" "$CREW_IOS_TARGET"
          python3 tools/ci/ios-device-to-simulator.py "$APP"
          # Inside out: frameworks, then the app extensions (Live Activity), then the app.
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib "$APP"/PlugIns/*.appex/Frameworks/*.framework; do
            if [ -e "$f" ]; then codesign --force --sign - --timestamp=none "$f"; fi
          done
          for f in "$APP"/PlugIns/*.appex; do
            if [ -e "$f" ]; then codesign --force --sign - --timestamp=none "$f"; fi
          done
          codesign --force --sign - --timestamp=none "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Launch and watch for 40 s
        run: |
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,os; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith(os.environ["DEVICE_FAMILY"])))')
          mkdir -p launch
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 40
          xcrun simctl io "$DEVICE" screenshot launch/after-40s.png || true
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate "process CONTAINS 'Soir' OR eventMessage CONTAINS 'JS Exception' OR eventMessage CONTAINS 'RCTFatal'" > launch/app.log || true
          cp ~/Library/Logs/DiagnosticReports/*.ips launch/ 2>/dev/null || true
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE"; then
            echo "Still running 40 s after launch."
          else
            echo "::error::The app is not running 40 s after launch. Crash report and log are in the ios-launch artifact."
            grep -E "Unhandled JS Exception|Terminating app|Symbol not found|Library not loaded" launch/app.log | head -n 20 || true
            awk '/Terminating app/{f=1} f{print; n++} n>40{exit}' launch/app.log || true
            exit 1
          fi
      - name: Screens on iOS
        # Real iOS rendering of the main screens (clipped glyphs, safe areas, alignment), with a
        # profile already stored so the app opens past onboarding.
        run: |
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v))')
          xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          # A phone set up in France, like the profile below: a US region would show the "abroad?"
          # banner, ounces and 12-hour times on every screenshot. The region is read at boot.
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLocale -string fr_FR
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLanguages -array fr
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b > /dev/null
          xcrun simctl status_bar "$DEVICE" override --time 21:42 --batteryLevel 80 || true
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          STORE="$DATA/Library/Application Support/$BUNDLE/RCTAsyncLocalStorage_V1"
          mkdir -p "$STORE"
          python3 - "$STORE" <<'PY'
          import hashlib, json, os, sys, time, uuid
          now = int(time.time() * 1000)
          def pint(minutes_ago):
              at = now - minutes_ago * 60000
              return {"id": str(uuid.uuid4()), "presetId": "m-pint", "kind": "pint", "volumeMl": 500, "abv": 0.05,
                      "consumedAt": at, "loggedAt": at, "withFood": False, "sync": "saved"}
          state = {"state": {"ageConfirmedAt": now,
                   "preferences": {"language": "fr", "legalCountry": "FR", "bacUnit": "g_per_l_blood", "currency": "EUR"},
                   "profile": {"weightKg": 72, "bodyModel": "male", "declaredBody": "male", "healthConsentAt": now},
                   "drinks": [pint(70), pint(25)]}, "version": 0}
          # AsyncStorage keeps a long value in a file named after the key's MD5, with null in the manifest.
          key = "crew-app-v1"
          open(os.path.join(sys.argv[1], hashlib.md5(key.encode()).hexdigest()), "w").write(json.dumps(state))
          json.dump({key: None}, open(os.path.join(sys.argv[1], "manifest.json"), "w"))
          PY
          mkdir -p launch/screens
          n=1
          # One launch per screen: the app reads -ciRoute from its launch arguments (custom URL schemes
          # ask "Open in ...?" on recent simulators, which no script can answer).
          for route in / /crew /games /bars /me /settings /my-stats /add-drink /curve /limits /leaderboard /history /versions /profile /edit-profile /privacy-summary; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
            # SIMCTL_CHILD_ variables reach the app: Paris time, as the phone above.
            if [ "$route" = "/" ]; then SIMCTL_CHILD_TZ=Europe/Paris xcrun simctl launch "$DEVICE" "$BUNDLE"; else SIMCTL_CHILD_TZ=Europe/Paris xcrun simctl launch "$DEVICE" "$BUNDLE" -ciRoute "$route"; fi
            sleep 10
            name=$(echo "$route" | tr -d '/'); [ -z "$name" ] && name=party
            xcrun simctl io "$DEVICE" screenshot "launch/screens/$(printf %02d $n)-$name.png" || true
            n=$((n + 1))
          done
      - name: Startup diagnostic without JavaScript, then normal recovery
        run: |
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v))')
          xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          # Do not start React: the diagnostic must be drawn by UIKit alone.
          xcrun simctl launch "$DEVICE" "$BUNDLE" -crewStartupTestNoJS
          sleep 12
          xcrun simctl io "$DEVICE" screenshot launch/screens/17-startup-diagnostic.png
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          # No test flag persists: a fresh launch must reach the app again.
          xcrun simctl launch "$DEVICE" "$BUNDLE" -crewStartupTestRecovery -ciRoute /settings
          sleep 12
          xcrun simctl io "$DEVICE" screenshot launch/screens/18-startup-recovery.png
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "SC_STARTUP"' > launch/startup-diagnostic.log
          grep -q 'SC_TEST_NO_JS_DIAGNOSTIC_VISIBLE' launch/startup-diagnostic.log
          grep -q 'SC_TEST_RECOVERED' launch/startup-diagnostic.log
      - name: Native server status distinguishes HTTP failures from a network outage
        run: |
          python3 tools/ci/network-diagnostic-stub.py > /tmp/network-diagnostic-stub.log 2>&1 &
          STUB_PID=$!
          trap 'kill "$STUB_PID" 2>/dev/null || true' EXIT
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v))')
          xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          xcrun simctl launch "$DEVICE" "$BUNDLE" -ciRoute /server-status -ciDiagnosticServer http://127.0.0.1:8799
          sleep 20
          xcrun simctl io "$DEVICE" screenshot launch/screens/19-server-status.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'eventMessage CONTAINS "SC_NETWORK"' > launch/network-diagnostic.log
          grep -q 'SC_NETWORK /v1/health SC_OK HTTP200' launch/network-diagnostic.log
          grep -q 'SC_NETWORK /v1/info SC_HTTP_500 HTTP500' launch/network-diagnostic.log
          grep -q 'SC_NETWORK /v1/ready SC_DB_01 HTTP503' launch/network-diagnostic.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-launch${{ matrix.family == 'iPad' && '-ipad' || '' }}
          path: launch
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  release:
    # Every build of main becomes the latest release, so these links never change:
    # https://github.com/<owner>/soiree-crew/releases/latest/download/soiree-crew-unsigned.ipa
    # https://github.com/<owner>/soiree-crew/releases/latest/download/soiree-crew.apk
    needs: [version, checks, ios, ios-launch, android]
    # The APK job is usually skipped; the release goes out with what was built.
    # Only repository-owned PR branches may publish previews. Forks keep read-only build artifacts.
    if: always() && needs.checks.result == 'success' && needs.ios.result == 'success' && needs.ios-launch.result == 'success' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || inputs.pr != '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and the tags: the notes list what changed since the last release.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: soiree-crew-*-unsigned
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.android.result == 'success'
        with:
          name: soiree-crew-android
          path: dist
      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.CREW_WORKFLOW_TOKEN || github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          CREW_RELEASE_CHANNEL: ${{ (github.event_name == 'pull_request' || inputs.pr != '') && 'preview' || 'public' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node tools/ci/publish-release.mjs
      - name: Verify published release assets and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published.json"
          node tools/ci/delivery-integrity.mjs assets "$RUNNER_TEMP/published.json" "$RELEASE_TAG" dist/*.ipa dist/ios-build-info-*.json
          if [[ -f dist/soiree-crew.apk ]]; then node tools/ci/delivery-integrity.mjs assets "$RUNNER_TEMP/published.json" "$RELEASE_TAG" dist/soiree-crew.apk; fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$GITHUB_SHA"

  altstore:
    # docs/ALTSTORE.md: the source is rewritten from the published releases, with this build's screenshots.
    needs: release
    # The skipped APK job up the chain would skip this one too without always().
    if: always() && needs.release.result == 'success'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/altstore.yml
    with:
      screenshots: true
      release_tag: ${{ needs.release.outputs.tag }}

  # The check the main ruleset requires (with `checks`). The ios jobs only report when an IPA is
  # built, so an OTA or checks-only change could never merge if they were required. This gate is
  # green only when the change shipped the way the route decided: a new IPA built and launched,
  # an OTA update published, or checks only.
  build-gate:
    if: always()
    needs: [checks, version, ota, ios, ios-launch, release, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the route was carried out
        env:
          ROUTE: ${{ needs.version.outputs.route || 'ipa' }}
          CHECKS: ${{ needs.checks.result }}
          VERSION: ${{ needs.version.result }}
          OTA: ${{ needs.ota.result }}
          IOS: ${{ needs.ios.result }}
          LAUNCH: ${{ needs.ios-launch.result }}
          RELEASE: ${{ needs.release.result }}
          ANDROID: ${{ needs.android.result }}
          PUBLICATION_REQUIRED: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || inputs.pr != '' }}
          ANDROID_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.android }}
        run: |
          node tools/ci/delivery-integrity.mjs gate
          echo "### Build gate: $ROUTE route carried out" >> "$GITHUB_STEP_SUMMARY"
