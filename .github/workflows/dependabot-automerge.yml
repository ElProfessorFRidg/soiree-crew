# Only Dependabot patch PRs are eligible for automatic merging.
# GitHub's auto-merge setting and required CI status checks must both be enabled.
# This privileged workflow NEVER checks out or executes pull-request code.
name: Dependabot safe auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Get Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major and minor updates (including security fixes) require manual review.
      # Even a patch can be risky: required Build / checks must be enforced
      # through main branch protection before this workflow is activated.
      - name: Queue verified patch for merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
