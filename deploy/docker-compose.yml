# Soirée Crew server for Coolify (or plain Docker Compose). See deploy/README.md.
# Coolify: new resource > Docker Compose > this repository, compose path deploy/docker-compose.yml,
# then set the domain on the "server" service (port 8787) and fill the variables below.
services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://crew:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/crew
      DATA_KEY: ${DATA_KEY:?set DATA_KEY (openssl rand -base64 32)}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://crew.example.com}
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "1"
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEASON_VARIANTS: ${SEASON_VARIANTS:-}
      # Push (O-38), optional: deploy/README.md.
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      DOWNLOADS_DIR: /downloads
    volumes:
      - uploads:/data
      # The APK built on this machine (android-builder below), served at /download/soiree-crew.apk.
      - ${DOWNLOADS_HOST_DIR:-./downloads}:/downloads:ro
    depends_on:
      db:
        condition: service_healthy
    # No published port: only the reverse proxy reaches the app (TRUST_PROXY relies on it).
    expose:
      - "8787"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crew
      POSTGRES_DB: crew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew -d crew"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Builds the Android APK here, on demand or from a timer (deploy/README.md). Not started with the stack:
  #   docker compose --profile android run --rm android-builder
  android-builder:
    profiles: ["android"]
    build:
      context: ./android
    environment:
      REPO_URL: ${ANDROID_REPO_URL:-git@github.com:ElProfessorFRidg/soiree-crew.git}
      BRANCH: ${ANDROID_BRANCH:-main}
      CREW_SERVER_URL: ${PUBLIC_URL:-}
      CREW_PUBLIC_SERVERS: ${CREW_PUBLIC_SERVERS:-}
    volumes:
      - ${DOWNLOADS_HOST_DIR:-./downloads}:/downloads
      - android-work:/work
      - android-cache:/cache
      # A read-only deploy key for the private repository.
      - ${ANDROID_DEPLOY_KEY_DIR:-./android/ssh}:/root/.ssh:ro

volumes:
  uploads:
  pgdata:
  android-work:
  android-cache:
